name: Check MeshShare

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    name: Static checks (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libwayland-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features --locked -- -D warnings

  rust-tests:
    name: Rust tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libwayland-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Run Rust regression tests
        run: cargo test --manifest-path backend/Cargo.toml --all-features --locked

  android:
    name: Android APK build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Select Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_home="$ANDROID_HOME/ndk/27.2.12479018"
          compiler="$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          if [[ ! -x "$compiler" ]]; then
            echo "::error::Android NDK 27.2.12479018 compiler is missing: $compiler"
            exit 1
          fi
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_home" >> "$GITHUB_ENV"
          echo "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npx --yes @tauri-apps/cli@2 android init --ci --skip-targets-install
        working-directory: backend
      - run: python3 .github/scripts/prepare_android_project.py
      - name: Configure Gradle repositories
        shell: bash
        run: |
          set -euo pipefail
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home/init.d"
          cp .github/scripts/gradle-mirror.init.gradle "$gradle_user_home/init.d/"
      - run: npx --yes @tauri-apps/cli@2 android build --debug --apk --target aarch64
        working-directory: backend
