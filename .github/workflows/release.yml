name: Build and Release MeshShare

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate Chinese release notes
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME || vars.LLM_MODEL_NAME }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python3 .github/scripts/gen_release_notes.py "$GITHUB_REF_NAME" release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: |
              src-tauri/target/release/bundle/nsis/*-setup.exe*
              src-tauri/target/release/bundle/msi/*.msi*
          - os: macos-15-intel
            name: macos-x64
            bundles: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - os: macos-15
            name: macos-arm64
            bundles: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - os: ubuntu-24.04
            name: linux-x64
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage*
              src-tauri/target/release/bundle/deb/*.deb*
              src-tauri/target/release/bundle/rpm/*.rpm*
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set application version from tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a release tag such as v1.2.3"
            exit 1
          fi
          printf '{"version":"%s"}\n' "${GITHUB_REF_NAME#v}" > release-version.json
      - name: Validate updater signing key
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python .github/scripts/validate_updater_key.py
          else
            python3 .github/scripts/validate_updater_key.py
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Run Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '2.12.4' --locked
      - name: Build application
        run: cargo tauri build --config release-version.json -- --locked
      - name: Name macOS updater artifacts by architecture
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.name }}" == "macos-x64" ]]; then
            arch="x64"
          else
            arch="aarch64"
          fi
          shopt -s nullglob
          archives=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected exactly one macOS updater archive"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          source="${archives[0]}"
          target="src-tauri/target/release/bundle/macos/MeshShare_${version}_${arch}.app.tar.gz"
          if [[ ! -s "$source" || ! -s "$source.sig" ]]; then
            echo "::error::macOS updater archive or signature is missing"
            exit 1
          fi
          if [[ "$source" != "$target" ]]; then
            mv "$source" "$target"
            mv "$source.sig" "$target.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MeshShare-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: [notes, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MeshShare-*
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish verified installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          if [[ ! -s release-notes.md ]]; then
            echo "::error::Release notes are missing"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "MeshShare_${version}_x64-setup.exe"
            "MeshShare_${version}_x64-setup.exe.sig"
            "MeshShare_${version}_x64_en-US.msi"
            "MeshShare_${version}_x64_en-US.msi.sig"
            "MeshShare_${version}_x64.dmg"
            "MeshShare_${version}_aarch64.dmg"
            "MeshShare_${version}_amd64.AppImage"
            "MeshShare_${version}_amd64.AppImage.sig"
            "MeshShare_${version}_amd64.deb"
            "MeshShare_${version}_amd64.deb.sig"
            "MeshShare-${version}-1.x86_64.rpm"
            "MeshShare-${version}-1.x86_64.rpm.sig"
          )
          mapfile -t mac_updater_assets < <(find release-assets -type f -name '*.app.tar.gz*' -printf '%f\n' | sort -u)
          if (( ${#mac_updater_assets[@]} != 4 )); then
            echo "::error::Expected two macOS updater bundles and two signatures"
            printf '%s\n' "${mac_updater_assets[@]}"
            exit 1
          fi
          expected+=("${mac_updater_assets[@]}")
          installers=()
          for name in "${expected[@]}"; do
            matches=(release-assets/MeshShare-*/**/"$name")
            if (( ${#matches[@]} != 1 )) || [[ ! -s "${matches[0]}" ]]; then
              echo "::error::Expected exactly one nonempty installer named $name"
              exit 1
            fi
            installers+=("${matches[0]}")
          done

          mapfile -t matching_releases < <(gh release list --repo "$GH_REPO" --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq ".[] | select(.tagName == \"$GITHUB_REF_NAME\") | [.tagName, .isDraft, .isPrerelease] | @tsv")
          if (( ${#matching_releases[@]} > 1 )); then
            echo "::error::Multiple releases for $GITHUB_REF_NAME. Resolve the duplicate drafts before retrying."
            printf '%s\n' "${matching_releases[@]}"
            exit 1
          fi
          if (( ${#matching_releases[@]} == 1 )); then
            release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" --json databaseId --jq '.databaseId')
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --repo "$GH_REPO" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
            release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" --json databaseId --jq '.databaseId')
          fi
          if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" --json isPrerelease --jq '.isPrerelease')" == "true" ]]; then
            echo "::error::Updater releases must be stable releases, not prereleases"
            exit 1
          fi

          assets_url="repos/$GH_REPO/releases/$release_id/assets?per_page=100"
          existing=$(gh api --paginate "$assets_url" --jq '.[].name')
          if [[ -n "$existing" ]]; then
            for name in "${expected[@]}" latest.json; do
              existing=$(awk -v name="$name" '$0 != name' <<< "$existing")
            done
            if [[ -n "$existing" ]]; then
              echo "::error::Unexpected assets in $GITHUB_REF_NAME. Review them before retrying."
              printf '%s\n' "$existing"
              exit 1
            fi
          fi

          for installer in "${installers[@]}"; do
            gh release upload "$GITHUB_REF_NAME" --repo "$GH_REPO" --clobber "$installer"
          done

          python3 .github/scripts/generate_updater_manifest.py \
            --assets-root release-assets \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --output latest.json
          python3 -m json.tool latest.json >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GH_REPO" --clobber latest.json

          uploaded=$(gh api --paginate "$assets_url" --jq '.[] | if .state == "uploaded" and .size > 0 then .name else "Incomplete upload: " + .name end')
          expected_names=$(printf '%s\n' "${expected[@]}" latest.json | sort)
          if [[ "$(sort <<< "$uploaded")" != "$(sort <<< "$expected_names")" ]]; then
            echo "::error::Release assets do not match the installers and updater manifest for $GITHUB_REF_NAME"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GH_REPO" --notes-file release-notes.md --draft=false
