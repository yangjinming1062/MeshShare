name: Build and Release Desktop Apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: MeshShare-windows-x64
          - name: macOS x64
            os: macos-13
            artifact: MeshShare-macos-x64
          - name: macOS arm64
            os: macos-14
            artifact: MeshShare-macos-arm64
          - name: Linux x64
            os: ubuntu-24.04
            artifact: MeshShare-linux-x64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install --upgrade pyinstaller
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MeshShare --add-data "web;web" launcher.py
          mv dist/MeshShare.exe "dist/${{ matrix.artifact }}.exe"
      - name: Build Unix application
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name MeshShare --add-data "web:web" launcher.py
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/MeshShare.app "dist/${{ matrix.artifact }}.zip"
          else
            tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" MeshShare
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.exe
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --generate-notes --title "$TAG_NAME"
          fi
