name: Build and Release MeshShare

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: 2.12.4

concurrency:
  group: release-${{ github.ref }}

jobs:
  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate Chinese release notes
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME || vars.LLM_MODEL_NAME }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python3 .github/scripts/gen_release_notes.py "$GITHUB_REF_NAME" release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: |
              backend/target/release/bundle/nsis/*-setup.exe*
              backend/target/release/bundle/msi/*.msi*
          - os: macos-15-intel
            name: macos-x64
            bundles: |
              backend/target/release/bundle/dmg/*.dmg
              backend/target/release/bundle/macos/*.app.tar.gz*
          - os: macos-15
            name: macos-arm64
            bundles: |
              backend/target/release/bundle/dmg/*.dmg
              backend/target/release/bundle/macos/*.app.tar.gz*
          - os: ubuntu-24.04
            name: linux-x64
            bundles: |
              backend/target/release/bundle/appimage/*.AppImage*
              backend/target/release/bundle/deb/*.deb*
              backend/target/release/bundle/rpm/*.rpm*
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set application version from tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a release tag such as v1.2.3"
            exit 1
          fi
          printf '{"version":"%s"}\n' "${GITHUB_REF_NAME#v}" > release-version.json
      - name: Prepare Apple signing and notarization credentials
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must start with 'Developer ID Application:'"
            exit 1
          fi

          has_api_credentials=false
          if [[ -n "${APPLE_API_KEY:-}" || -n "${APPLE_API_ISSUER:-}" || -n "${APPLE_API_PRIVATE_KEY:-}" ]]; then
            has_api_credentials=true
          fi
          if [[ "$has_api_credentials" == true ]]; then
            for name in APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::All of APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY are required together"
                exit 1
              fi
            done
            mkdir -p private_keys
            key_path="$PWD/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            python3 - "$key_path" <<'PY'
          import base64
          import pathlib
          import sys

          output = pathlib.Path(sys.argv[1])
          output.write_bytes(base64.b64decode(__import__("os").environ["APPLE_API_PRIVATE_KEY"], validate=True))
          output.chmod(0o600)
          PY
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            echo "APPLE_NOTARY_MODE=api" >> "$GITHUB_ENV"
          else
            for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Set APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_PRIVATE_KEY or all of APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID"
                exit 1
              fi
            done
            echo "APPLE_NOTARY_MODE=apple-id" >> "$GITHUB_ENV"
          fi
      - name: Validate updater signing key
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python .github/scripts/validate_updater_key.py
          else
            python3 .github/scripts/validate_updater_key.py
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libwayland-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Cache Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_CLI_VERSION }}
      - name: Install Tauri CLI
        shell: bash
        run: |
          if cargo tauri --version 2>/dev/null | grep -Fq "$TAURI_CLI_VERSION"; then
            echo "Using cached Tauri CLI $TAURI_CLI_VERSION"
          else
            cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked
          fi
          cargo tauri --version
      - name: Build application
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo tauri build --config release-version.json -- --locked
      - name: Notarize and validate macOS installers
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(backend/target/release/bundle/macos/*.app)
          dmgs=(backend/target/release/bundle/dmg/*.dmg)
          if (( ${#apps[@]} != 1 )); then
            echo "::error::Expected exactly one macOS app bundle"
            printf '%s\n' "${apps[@]}"
            exit 1
          fi
          if (( ${#dmgs[@]} != 1 )); then
            echo "::error::Expected exactly one macOS DMG"
            printf '%s\n' "${dmgs[@]}"
            exit 1
          fi
          app="${apps[0]}"
          dmg="${dmgs[0]}"

          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -E 'Authority=|TeamIdentifier=|Signature=' || true
          if [[ "${APPLE_NOTARY_MODE:-}" == api ]]; then
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
          else
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=4 "$app"
          hdiutil verify "$dmg"
      - name: Name macOS updater artifacts by architecture
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.name }}" == "macos-x64" ]]; then
            arch="x64"
          else
            arch="aarch64"
          fi
          shopt -s nullglob
          archives=(backend/target/release/bundle/macos/*.app.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected exactly one macOS updater archive"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          source="${archives[0]}"
          target="backend/target/release/bundle/macos/MeshShare_${version}_${arch}.app.tar.gz"
          if [[ ! -s "$source" || ! -s "$source.sig" ]]; then
            echo "::error::macOS updater archive or signature is missing"
            exit 1
          fi
          if [[ "$source" != "$target" ]]; then
            mv "$source" "$target"
            mv "$source.sig" "$target.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MeshShare-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: [notes, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: MeshShare-*
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Publish verified prerelease installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          if [[ ! -s release-notes.md ]]; then
            echo "::error::Release notes are missing"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "MeshShare_${version}_x64-setup.exe"
            "MeshShare_${version}_x64-setup.exe.sig"
            "MeshShare_${version}_x64_en-US.msi"
            "MeshShare_${version}_x64_en-US.msi.sig"
            "MeshShare_${version}_x64.dmg"
            "MeshShare_${version}_aarch64.dmg"
            "MeshShare_${version}_amd64.AppImage"
            "MeshShare_${version}_amd64.AppImage.sig"
            "MeshShare_${version}_amd64.deb"
            "MeshShare_${version}_amd64.deb.sig"
            "MeshShare-${version}-1.x86_64.rpm"
            "MeshShare-${version}-1.x86_64.rpm.sig"
          )
          mapfile -t mac_updater_assets < <(find release-assets -type f -name '*.app.tar.gz*' -printf '%f\n' | sort -u)
          if (( ${#mac_updater_assets[@]} != 4 )); then
            echo "::error::Expected two macOS updater bundles and two signatures"
            printf '%s\n' "${mac_updater_assets[@]}"
            exit 1
          fi
          expected+=("${mac_updater_assets[@]}")
          installers=()
          for name in "${expected[@]}"; do
            matches=(release-assets/MeshShare-*/**/"$name")
            if (( ${#matches[@]} != 1 )) || [[ ! -s "${matches[0]}" ]]; then
              echo "::error::Expected exactly one nonempty installer named $name"
              exit 1
            fi
            installers+=("${matches[0]}")
          done

          python3 .github/scripts/generate_updater_manifest.py \
            --assets-root release-assets \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --output latest.json
          python3 -m json.tool latest.json >/dev/null

          mapfile -t matching_releases < <(gh release list --repo "$GH_REPO" --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq ".[] | select(.tagName == \"$GITHUB_REF_NAME\") | [.tagName, .isDraft, .isPrerelease] | @tsv")
          if (( ${#matching_releases[@]} > 1 )); then
            echo "::error::Multiple releases for $GITHUB_REF_NAME. Resolve the duplicate releases before retrying."
            printf '%s\n' "${matching_releases[@]}"
            exit 1
          fi
          if (( ${#matching_releases[@]} == 1 )); then
            release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" --json databaseId --jq '.databaseId')
            release_state=$(gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')
            IFS=$'\t' read -r is_draft is_prerelease <<< "$release_state"
            if [[ "$is_draft" != "true" && "$is_prerelease" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already stable; refusing to overwrite its manual promotion"
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
              --repo "$GH_REPO" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
            release_id=$(gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" --json databaseId --jq '.databaseId')
          fi

          assets_url="repos/$GH_REPO/releases/$release_id/assets?per_page=100"
          existing=$(gh api --paginate "$assets_url" --jq '.[].name')
          if [[ -n "$existing" ]]; then
            for name in "${expected[@]}" latest.json; do
              existing=$(awk -v name="$name" '$0 != name' <<< "$existing")
            done
            if [[ -n "$existing" ]]; then
              echo "::error::Unexpected assets in $GITHUB_REF_NAME. Review them before retrying."
              printf '%s\n' "$existing"
              exit 1
            fi
          fi

          for installer in "${installers[@]}"; do
            gh release upload "$GITHUB_REF_NAME" --repo "$GH_REPO" --clobber "$installer"
          done

          gh release upload "$GITHUB_REF_NAME" --repo "$GH_REPO" --clobber latest.json

          uploaded=$(gh api --paginate "$assets_url" --jq '.[] | if .state == "uploaded" and .size > 0 then .name else "Incomplete upload: " + .name end')
          expected_names=$(printf '%s\n' "${expected[@]}" latest.json | sort)
          if [[ "$(sort <<< "$uploaded")" != "$(sort <<< "$expected_names")" ]]; then
            echo "::error::Release assets do not match the installers and updater manifest for $GITHUB_REF_NAME"
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GH_REPO" --notes-file release-notes.md --draft=false --prerelease
          echo "Published $GITHUB_REF_NAME as a prerelease; promote it manually after validation."
