name: Build and Release MeshShare

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            bundles: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-15-intel
            name: macos-x64
            bundles: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15
            name: macos-arm64
            bundles: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-24.04
            name: linux-x64
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Build application
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: MeshShare-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MeshShare-*
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/MeshShare-*/**/*
          fail_on_unmatched_files: true
          preserve_order: true
