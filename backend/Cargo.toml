[package]
name = "meshshare"
version = "0.1.0"
description = "MeshShare decentralized LAN clipboard and file transfer"
authors = ["MeshShare"]
edition = "2021"
rust-version = "1.90"
default-run = "meshshare"

[[bin]]
name = "meshshare"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "meshshare-headless"
path = "src/bin/headless.rs"
required-features = ["headless"]

[lib]
name = "meshshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { optional = true, version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
base64 = "0.22"
futures-util = "0.3"
if-addrs = "0.13"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
tempfile = { version = "3", optional = true }
minisign-verify = { version = "0.3", optional = true }
mdns-sd = "0.11"
parking_lot = "0.12"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
russh = { version = "0.65.4", default-features = false, features = ["ring"] }
rand = "0.10"
rcgen = { version = "0.14", features = ["x509-parser"] }
pem = "3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.31", default-features = false, features = ["disk", "network", "system"] }
tauri = { optional = true, version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[features]
default = ["gui"]
gui = [
    "dep:tauri-build",
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
    "dep:arboard",
    "dep:gtk",
    "dep:gdkx11",
    "dep:x11rb",
]
headless = ["dep:minisign-verify", "dep:tempfile"]
custom-protocol = ["gui", "tauri/custom-protocol"]

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", optional = true }
tauri-plugin-updater = { version = "=2.14.1", optional = true }
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
portable-pty = "0.9"
arboard = { optional = true, version = "3.4", features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", features = ["mac_os_10_8_features"] }
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSScreen", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }
x11rb = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-result = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
