[package]
name = "meshshare"
version = "0.1.0"
description = "MeshShare decentralized LAN clipboard and file transfer"
authors = ["MeshShare"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "meshshare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws", "multipart"] }
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
base64 = "0.22"
futures-util = "0.3"
if-addrs = "0.13"
hostname = "0.4"
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
mdns-sd = "0.11"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
raw-window-handle = "0.6"
rcgen = { version = "0.14", features = ["x509-parser"] }
pem = "3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.31", default-features = false, features = ["disk", "network", "system"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "=2.14.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.4", features = ["wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", features = ["mac_os_10_8_features"] }
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSScreen", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-result = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
